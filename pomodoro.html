<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f3f6fb">
<link rel="icon" type="image/svg+xml" href="assets/yorungen-mark.svg">
<title>Pomodoro ve Çalışma Geçmişi — Ders Asist</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { min-height: 100vh; background: linear-gradient(180deg,#f3f6fb 0%,#eef3f8 100%); color: #1f2937; transition: background .25s ease,color .25s ease; }
  body[data-theme="dark"] { background: radial-gradient(circle at top left,#1f2b3d 0%,#111827 32%,#0f172a 100%); color: #e2e8f0; }
  .page { width: 100%; min-height: 100vh; margin: 0; padding: 20px 22px 40px; background: rgba(255,255,255,.72); border: 1px solid rgba(148,163,184,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); backdrop-filter: blur(12px); }
  body[data-theme="dark"] .page { background: rgba(15,23,42,.78); }
  .nav-bar { display: flex; gap: 10px; margin-bottom: 22px; padding-bottom: 12px; border-bottom: 1px solid rgba(148,163,184,.18); flex-wrap: wrap; }
  .brand-link { display: inline-flex; align-items: center; gap: 9px; margin-right: 8px; color: #0f172a; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; text-decoration: none; white-space: nowrap; }
  body[data-theme="dark"] .brand-link { color: #f8fafc; }
  .brand-link img { display: block; width: 34px; height: 34px; }
  .nav-btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 16px; border: 1px solid rgba(148,163,184,.2); border-radius: 12px; background: rgba(255,255,255,.72); color: #475569; font-size: 13px; font-weight: 700; text-decoration: none; transition: all .2s ease; }
  body[data-theme="dark"] .nav-btn { background: rgba(30,41,59,.9); color: #cbd5e1; }
  .nav-btn:hover { transform: translateY(-1px); }
  .nav-btn.active { background: linear-gradient(135deg,#e0ecff,#dfe7ff); color: #1e3a8a; box-shadow: 0 8px 18px rgba(96,165,250,.14); }
  body[data-theme="dark"] .nav-btn.active { background: linear-gradient(135deg,rgba(96,165,250,.2),rgba(59,130,246,.24)); color: #dbeafe; }
  .page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
  h1 { margin-bottom: 5px; color: #0f172a; font-size: 25px; }
  body[data-theme="dark"] h1 { color: #f8fafc; }
  .subtitle { color: #64748b; font-size: 13px; line-height: 1.5; }
  body[data-theme="dark"] .subtitle { color: #94a3b8; }
  .theme-toggle,.secondary-btn,.primary-btn,.icon-btn { border: 1px solid rgba(148,163,184,.2); border-radius: 11px; padding: 10px 14px; cursor: pointer; font-weight: 700; transition: transform .15s ease,filter .15s ease; }
  .theme-toggle,.secondary-btn,.icon-btn { background: rgba(148,163,184,.13); color: inherit; }
  .theme-toggle { position: fixed; top: 18px; right: 18px; z-index: 50; border-radius: 999px; padding: 10px 14px; background: rgba(255,255,255,.8); color: #0f172a; font-size: 12px; letter-spacing: .02em; box-shadow: 0 12px 24px rgba(15,23,42,.12); }
  body[data-theme="dark"] .theme-toggle { border-color: rgba(148,163,184,.18); background: rgba(15,23,42,.8); color: #f8fafc; }
  .theme-toggle:hover,.secondary-btn:hover,.primary-btn:hover,.icon-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .primary-btn { border: 0; background: linear-gradient(135deg,#2563eb,#1e3a8a); color: white; box-shadow: 0 10px 20px rgba(37,99,235,.2); }
  .layout { display: grid; grid-template-columns: minmax(0,1.05fr) minmax(320px,.95fr); gap: 18px; align-items: start; }
  .card { min-width: 0; padding: clamp(18px,3vw,28px); border: 1px solid rgba(148,163,184,.18); border-radius: 20px; background: rgba(255,255,255,.82); box-shadow: 0 12px 30px rgba(15,23,42,.07); }
  body[data-theme="dark"] .card { border-color: rgba(148,163,184,.18); background: rgba(15,23,42,.84); box-shadow: 0 18px 44px rgba(2,6,23,.28); }
  .profile-row { display: flex; gap: 8px; align-items: center; margin-bottom: 22px; }
  .profile-row select { flex: 1; min-width: 0; }
  select,input[type="number"] { border: 1px solid rgba(148,163,184,.24); border-radius: 10px; padding: 10px 12px; background: rgba(255,255,255,.82); color: inherit; font-size: 14px; }
  body[data-theme="dark"] select,body[data-theme="dark"] input[type="number"] { border-color: rgba(148,163,184,.24); background: rgba(2,6,23,.45); color: #e2e8f0; }
  .mode-buttons { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; padding: 6px; margin-bottom: 14px; border-radius: 14px; background: rgba(148,163,184,.12); }
  .mode-btn { border: 0; border-radius: 10px; padding: 10px 6px; background: transparent; color: #64748b; font-size: 12px; font-weight: 800; cursor: pointer; }
  body[data-theme="dark"] .mode-btn { color: #94a3b8; }
  .mode-btn.active { background: #fff; color: #1d4ed8; box-shadow: 0 2px 8px rgba(15,23,42,.1); }
  body[data-theme="dark"] .mode-btn.active { background: #1e3a8a; color: #dbeafe; }
  .timer-wrap { text-align: center; padding: 12px 0 4px; }
  .timer { color: #0f172a; font-size: clamp(76px,12vw,112px); font-weight: 800; letter-spacing: -5px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  body[data-theme="dark"] .timer { color: #f8fafc; }
  .timer-status { min-height: 21px; margin-top: 6px; color: #64748b; font-size: 13px; font-weight: 700; }
  body[data-theme="dark"] .timer-status { color: #94a3b8; }
  .timer-status.completed { color: #16a34a; }
  .timer-controls { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 20px 0 12px; }
  .timer-controls .primary-btn { min-width: 150px; padding: 13px 22px; font-size: 15px; }
  .extra-time { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
  .extra-time .secondary-btn { padding: 8px 13px; font-size: 12px; }
  .settings { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding-top: 18px; border-top: 1px solid rgba(148,163,184,.18); }
  .settings label { display: grid; gap: 7px; color: #64748b; font-size: 11px; font-weight: 800; }
  body[data-theme="dark"] .settings label { color: #94a3b8; }
  .settings input { width: 100%; }
  .section-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  h2 { color: #0f172a; font-size: 18px; }
  body[data-theme="dark"] h2 { color: #f8fafc; }
  .history-list { display: grid; gap: 8px; max-height: 420px; overflow-y: auto; }
  .history-item { padding: 11px 12px; border: 1px solid rgba(148,163,184,.15); border-radius: 12px; background: rgba(148,163,184,.06); }
  .history-item-top { display: flex; justify-content: space-between; gap: 10px; color: #334155; font-size: 13px; font-weight: 800; }
  body[data-theme="dark"] .history-item-top { color: #e2e8f0; }
  .history-item small { display: block; margin-top: 5px; color: #64748b; font-size: 11px; }
  body[data-theme="dark"] .history-item small { color: #94a3b8; }
  .empty-state { padding: 28px 14px; border: 1px dashed rgba(148,163,184,.28); border-radius: 12px; color: #64748b; font-size: 13px; line-height: 1.55; text-align: center; }
  body[data-theme="dark"] .empty-state { color: #94a3b8; }
  .summary { display: grid; grid-template-columns: repeat(2,1fr); gap: 9px; margin-top: 14px; }
  .summary-card { padding: 12px; border: 1px solid rgba(148,163,184,.16); border-radius: 12px; background: rgba(59,130,246,.07); }
  .summary-card span { display: block; color: #64748b; font-size: 11px; }
  .summary-card strong { display: block; margin-top: 4px; color: #1d4ed8; font-size: 19px; }
  body[data-theme="dark"] .summary-card strong { color: #93c5fd; }
  .history-footer { display: flex; justify-content: flex-end; margin-top: 13px; }
  .clear-btn { border: 0; background: transparent; color: #dc2626; font-size: 12px; text-decoration: underline; cursor: pointer; }
  .alarm-setting { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: #64748b; font-size: 11px; }
  .alarm-setting input { width: 100px; accent-color: #2563eb; }
  .toast { position: fixed; z-index: 20; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 15px; border-radius: 12px; background: #0f172a; color: #fff; font-size: 13px; box-shadow: 0 10px 24px rgba(15,23,42,.22); }
  .toast[hidden] { display: none; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .page { padding: 14px 12px 26px; } .page-heading { align-items: flex-start; } .page-heading h1 { font-size: 21px; } .theme-toggle { padding: 9px; font-size: 12px; } .settings { gap: 7px; } .settings input { padding: 9px 7px; } .mode-btn { font-size: 11px; } .timer { letter-spacing: -3px; } .timer-controls .primary-btn { min-width: 120px; } }
</style>
</head>
<body data-theme="light">
<div class="page">
  <nav class="nav-bar" aria-label="Ana gezinme">
    <a href="index.html" class="brand-link" aria-label="Yörüngen ana sayfa"><img src="assets/yorungen-mark.svg" alt=""><span>Yörüngen</span></a>
    <a href="index.html" class="nav-btn">📐 Soru Çözücü</a>
    <a href="planlayici.html" class="nav-btn">📅 Haftalık Program</a>
    <a href="notlar.html" class="nav-btn">📝 Notlar</a>
    <a href="pomodoro.html" class="nav-btn active" aria-current="page">⏱️ Pomodoro</a>
  </nav>
  <header class="page-heading">
    <div><h1>⏱️ Pomodoro</h1><p class="subtitle">Odaklanma oturumlarını başlat, tamamlanan çalışmalarını takip et.</p></div>
    <button type="button" id="themeToggle" class="theme-toggle"><span id="themeIcon">🌙</span> <span id="themeText">Koyu</span></button>
  </header>
  <main class="layout">
    <section class="card" aria-label="Pomodoro zamanlayıcısı">
      <div class="profile-row">
        <select id="activeProfile" aria-label="Zamanlayıcı profili"></select>
        <button type="button" class="icon-btn" id="addProfileBtn" aria-label="Profil ekle" title="Profil ekle">＋</button>
        <button type="button" class="icon-btn" id="deleteProfileBtn" aria-label="Seçili profili sil" title="Seçili profili sil">Sil</button>
      </div>
      <div class="mode-buttons" role="group" aria-label="Zamanlayıcı modu">
        <button type="button" class="mode-btn active" data-mode="work" aria-pressed="true">Odaklan</button>
        <button type="button" class="mode-btn" data-mode="short" aria-pressed="false">Kısa mola</button>
        <button type="button" class="mode-btn" data-mode="long" aria-pressed="false">Uzun mola</button>
      </div>
      <div class="timer-wrap">
        <div id="timer" class="timer" aria-live="off">25:00</div>
        <div id="timerStatus" class="timer-status" role="status">Başlamaya hazır</div>
      </div>
      <div class="timer-controls">
        <button type="button" id="startBtn" class="primary-btn">Başlat</button>
        <button type="button" id="resetBtn" class="secondary-btn">Sıfırla</button>
      </div>
      <div class="extra-time">
        <button type="button" class="secondary-btn" data-extra="1">+1 dk</button>
        <button type="button" class="secondary-btn" data-extra="5">+5 dk</button>
      </div>
      <div class="settings" aria-label="Profil süre ayarları">
        <label>Odak (dk)<input id="workTime" type="number" min="1" max="180" step="1"></label>
        <label>Kısa mola<input id="shortBreak" type="number" min="1" max="60" step="1"></label>
        <label>Uzun mola<input id="longBreak" type="number" min="1" max="120" step="1"></label>
      </div>
      <label class="alarm-setting" for="alarmVol">Bitiş sesi <input type="range" id="alarmVol" min="0" max="1" step="0.1" value="0.8"></label>
    </section>
    <section class="card" aria-label="Çalışma geçmişi">
      <div class="section-heading"><h2>📊 Çalışma geçmişi</h2></div>
      <div id="historyList" class="history-list"></div>
      <div class="summary">
        <div class="summary-card"><span>Toplam odak süresi</span><strong id="totalFocus">0 dk</strong></div>
        <div class="summary-card"><span>Tamamlanan odak</span><strong id="focusSessions">0</strong></div>
      </div>
      <div class="history-footer"><button type="button" id="clearHistoryBtn" class="clear-btn">Geçmişi temizle</button></div>
    </section>
  </main>
</div>
<audio id="alarmAudio" src="assets/pomo-alarm.mp3" preload="auto"></audio>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(() => {
  const PROFILE_KEY = 'pomo_profiles';
  const HISTORY_KEY = 'pomo_history';
  const ACTIVE_PROFILE_KEY = 'pomo_active_profile';
  const MODES = {
    work: { label: 'Odaklanma', input: 'workTime', defaultMinutes: 25 },
    short: { label: 'Kısa mola', input: 'shortBreak', defaultMinutes: 5 },
    long: { label: 'Uzun mola', input: 'longBreak', defaultMinutes: 15 }
  };
  const elements = {
    profile: document.getElementById('activeProfile'),
    timer: document.getElementById('timer'),
    status: document.getElementById('timerStatus'),
    start: document.getElementById('startBtn'),
    alarm: document.getElementById('alarmAudio'),
    toast: document.getElementById('toast'),
    history: document.getElementById('historyList'),
    totalFocus: document.getElementById('totalFocus'),
    focusSessions: document.getElementById('focusSessions'),
    themeText: document.getElementById('themeText'),
    themeIcon: document.getElementById('themeIcon'),
    themeToggle: document.getElementById('themeToggle')
  };
  let toastTimer = null;
  let alarmAudioContext = null;

  function readJson(key, fallback, expected) {
    const saved = localStorage.getItem(key);
    if (!saved) return fallback;
    try {
      const value = JSON.parse(saved);
      if (!expected(value)) throw new Error(`Beklenmeyen ${key} verisi.`);
      return value;
    } catch (error) {
      console.error(`${key} verisi okunamadı:`, error);
      showToast('Kayıtlı Pomodoro verilerinden biri okunamadı.');
      return fallback;
    }
  }

  function validMinutes(value, fallback, max) {
    const minutes = Number(value);
    return Number.isFinite(minutes) ? Math.min(max, Math.max(1, Math.round(minutes))) : fallback;
  }

  function normalizeProfiles(raw) {
    const profiles = {};
    Object.entries(raw).forEach(([name, value]) => {
      if (!value || typeof value !== 'object') return;
      profiles[name] = {
        work: validMinutes(value.work, 25, 180),
        short: validMinutes(value.short, 5, 60),
        long: validMinutes(value.long, 15, 120),
        pinned: Boolean(value.pinned)
      };
    });
    if (!Object.keys(profiles).length) profiles.varsayilan = { work: 25, short: 5, long: 15, pinned: false };
    return profiles;
  }

  let profiles = normalizeProfiles(readJson(PROFILE_KEY, {}, (value) => value && typeof value === 'object' && !Array.isArray(value)));
  let history = readJson(HISTORY_KEY, [], Array.isArray).filter((entry) => entry && typeof entry === 'object');
  let activeProfile = localStorage.getItem(ACTIVE_PROFILE_KEY) || 'varsayilan';
  if (!profiles[activeProfile]) activeProfile = Object.keys(profiles)[0];
  let currentMode = 'work';
  let remainingSeconds = profiles[activeProfile][currentMode] * 60;
  let deadline = null;
  let isRunning = false;
  let elapsedSeconds = 0;
  let segmentStartedAt = null;
  function showToast(message) {
    elements.toast.textContent = message;
    elements.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { elements.toast.hidden = true; }, 3500);
  }

  function saveProfiles() {
    localStorage.setItem(PROFILE_KEY, JSON.stringify(profiles));
  }

  function getActiveElapsedSeconds(now = Date.now()) {
    return elapsedSeconds + (isRunning && segmentStartedAt !== null ? Math.max(0, Math.floor((now - segmentStartedAt) / 1000)) : 0);
  }

  function formatTime(seconds) {
    const safeSeconds = Math.max(0, Math.ceil(seconds));
    const minutes = Math.floor(safeSeconds / 60);
    const remainder = safeSeconds % 60;
    return `${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
  }

  function renderProfiles() {
    const names = Object.keys(profiles).sort((a, b) => a.localeCompare(b, 'tr', { sensitivity: 'base' }));
    elements.profile.replaceChildren();
    names.forEach((name) => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name === 'varsayilan' ? 'Varsayılan' : name;
      elements.profile.appendChild(option);
    });
    elements.profile.value = activeProfile;
    document.getElementById('deleteProfileBtn').disabled = names.length === 1 && names[0] === 'varsayilan';
  }

  function syncInputs() {
    const profile = profiles[activeProfile];
    Object.entries(MODES).forEach(([mode, config]) => {
      document.getElementById(config.input).value = profile[mode];
    });
  }

  function setStatus(text, completed = false) {
    elements.status.textContent = text;
    elements.status.classList.toggle('completed', completed);
  }

  function updateDisplay() {
    if (isRunning && deadline !== null) remainingSeconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    elements.timer.textContent = formatTime(remainingSeconds);
    elements.start.textContent = isRunning ? 'Duraklat' : 'Başlat';
    document.title = `${formatTime(remainingSeconds)} — Pomodoro`;
  }

  function updateModeButtons() {
    document.querySelectorAll('.mode-btn').forEach((button) => {
      const active = button.dataset.mode === currentMode;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
  }

  function setMode(mode) {
    if (!MODES[mode]) return;
    isRunning = false;
    deadline = null;
    elapsedSeconds = 0;
    segmentStartedAt = null;
    currentMode = mode;
    remainingSeconds = profiles[activeProfile][mode] * 60;
    updateModeButtons();
    setStatus('Başlamaya hazır');
    updateDisplay();
  }

  function saveHistoryEntry() {
    const now = new Date();
    const duration = Math.max(1, Math.round(getActiveElapsedSeconds() / 60));
    const mode = currentMode;
    history.push({
      date: `${now.getDate()}/${now.getMonth() + 1} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
      completedAt: now.toISOString(),
      profile: activeProfile,
      mode,
      duration: String(duration)
    });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    renderHistory();
  }

  function unlockAlarm() {
    const AudioContextClass = window.AudioContext;
    if (!AudioContextClass) return;
    if (!alarmAudioContext) alarmAudioContext = new AudioContextClass();
    if (alarmAudioContext.state === 'suspended') {
      alarmAudioContext.resume().catch((error) => console.warn('Bitiş sesi etkinleştirilemedi:', error));
    }
  }

  function playFallbackAlarm() {
    if (!alarmAudioContext) return;
    const volume = Number(document.getElementById('alarmVol').value);
    if (volume === 0) return;

    const oscillator = alarmAudioContext.createOscillator();
    const gain = alarmAudioContext.createGain();
    const now = alarmAudioContext.currentTime;
    const duration = 2.7;
    const pulseLength = 0.42;
    oscillator.type = 'sine';
    gain.gain.setValueAtTime(0.0001, now);
    for (let pulse = 0; pulse < 6; pulse += 1) {
      const start = now + pulse * pulseLength;
      const end = Math.min(start + 0.28, now + duration);
      oscillator.frequency.setValueAtTime(pulse % 2 === 0 ? 880 : 988, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.2 * volume, start + 0.02);
      gain.gain.setValueAtTime(0.2 * volume, end - 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
    }
    oscillator.connect(gain);
    gain.connect(alarmAudioContext.destination);
    oscillator.start(now);
    oscillator.stop(now + duration);
  }

  function completeTimer() {
    if (!isRunning) return;
    elapsedSeconds = getActiveElapsedSeconds();
    isRunning = false;
    deadline = null;
    segmentStartedAt = null;
    remainingSeconds = 0;
    saveHistoryEntry();
    setStatus(`${MODES[currentMode].label} tamamlandı`, true);
    updateDisplay();
    elements.alarm.currentTime = 0;
    elements.alarm.play().catch(() => playFallbackAlarm());
    showToast(`${MODES[currentMode].label} oturumu tamamlandı.`);
  }

  function tick() {
    if (!isRunning || deadline === null) return;
    remainingSeconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    updateDisplay();
    if (remainingSeconds <= 0) completeTimer();
  }

  function toggleTimer() {
    unlockAlarm();
    if (isRunning) {
      elapsedSeconds = getActiveElapsedSeconds();
      remainingSeconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      isRunning = false;
      deadline = null;
      segmentStartedAt = null;
      setStatus('Duraklatıldı');
    } else {
      if (remainingSeconds <= 0) {
        showToast('Zamanlayıcıyı başlatmak için sıfırlayın veya ek süre ekleyin.');
        return;
      }
      isRunning = true;
      deadline = Date.now() + remainingSeconds * 1000;
      segmentStartedAt = Date.now();
      setStatus('Oturum devam ediyor');
    }
    updateDisplay();
  }

  function resetTimer() {
    isRunning = false;
    deadline = null;
    elapsedSeconds = 0;
    segmentStartedAt = null;
    remainingSeconds = profiles[activeProfile][currentMode] * 60;
    setStatus('Başlamaya hazır');
    updateDisplay();
  }

  function addExtra(minutes) {
    const max = currentMode === 'work' ? 180 : currentMode === 'short' ? 60 : 120;
    const profileDuration = profiles[activeProfile][currentMode];
    const addedMinutes = Math.min(minutes, max - profileDuration);
    if (addedMinutes <= 0) {
      showToast(`Bu mod için en fazla ${max} dakika ayarlanabilir.`);
      return;
    }

    profiles[activeProfile][currentMode] += addedMinutes;
    document.getElementById(MODES[currentMode].input).value = profiles[activeProfile][currentMode];
    saveProfiles();
    remainingSeconds += addedMinutes * 60;
    if (isRunning) deadline += addedMinutes * 60 * 1000;
    if (remainingSeconds > 0) setStatus(isRunning ? 'Oturum devam ediyor' : 'Ek süre eklendi');
    updateDisplay();
  }

  function deleteActiveProfile() {
    if (isRunning) {
      showToast('Bir profili silmeden önce zamanlayıcıyı duraklatın.');
      return;
    }
    if (!confirm(`"${activeProfile === 'varsayilan' ? 'Varsayılan' : activeProfile}" profili silinsin mi?`)) return;

    delete profiles[activeProfile];
    if (!Object.keys(profiles).length) {
      profiles.varsayilan = { work: 25, short: 5, long: 15, pinned: false };
    }
    activeProfile = profiles.varsayilan ? 'varsayilan' : Object.keys(profiles)[0];
    localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfile);
    saveProfiles();
    renderProfiles();
    syncInputs();
    setMode(currentMode);
  }

  function formatHistoryDate(item) {
    if (item.completedAt) {
      const date = new Date(item.completedAt);
      if (!Number.isNaN(date.getTime())) return date.toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });
    }
    return item.date || 'Tarih bilgisi yok';
  }

  function renderHistory() {
    elements.history.replaceChildren();
    const completedWork = history.filter((item) => item.mode === 'work');
    const totalMinutes = completedWork.reduce((sum, item) => sum + (Number(item.duration) || 0), 0);
    elements.totalFocus.textContent = `${totalMinutes} dk`;
    elements.focusSessions.textContent = String(completedWork.length);
    const latest = history.slice().reverse().slice(0, 30);
    if (!latest.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Henüz tamamlanmış oturum yok. Bir Pomodoro tamamlandığında burada görünecek.';
      elements.history.appendChild(empty);
      return;
    }
    latest.forEach((item) => {
      const row = document.createElement('article');
      row.className = 'history-item';
      const top = document.createElement('div');
      top.className = 'history-item-top';
      const label = document.createElement('span');
      label.textContent = `${MODES[item.mode]?.label || 'Oturum'} · ${item.profile || 'Varsayılan'}`;
      const duration = document.createElement('span');
      duration.textContent = `${Number(item.duration) || 0} dk`;
      const date = document.createElement('small');
      date.textContent = formatHistoryDate(item);
      top.append(label, duration);
      row.append(top, date);
      elements.history.appendChild(row);
    });
  }

  function applyTheme(theme) {
    const value = theme === 'dark' ? 'dark' : 'light';
    document.body.dataset.theme = value;
    document.documentElement.style.colorScheme = value;
    localStorage.setItem('planner-theme', value);
    elements.themeText.textContent = value === 'dark' ? 'Açık' : 'Koyu';
    elements.themeIcon.textContent = value === 'dark' ? '☀️' : '🌙';
  }

  elements.profile.addEventListener('change', () => {
    activeProfile = elements.profile.value;
    localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfile);
    syncInputs();
    setMode(currentMode);
  });
  document.querySelectorAll('.mode-btn').forEach((button) => button.addEventListener('click', () => setMode(button.dataset.mode)));
  elements.start.addEventListener('click', toggleTimer);
  document.getElementById('resetBtn').addEventListener('click', resetTimer);
  document.querySelectorAll('[data-extra]').forEach((button) => button.addEventListener('click', () => addExtra(Number(button.dataset.extra))));
  document.querySelectorAll('.settings input').forEach((input) => {
    input.addEventListener('change', () => {
      const mode = Object.keys(MODES).find((key) => MODES[key].input === input.id);
      if (!mode) return;
      const max = mode === 'work' ? 180 : mode === 'short' ? 60 : 120;
      profiles[activeProfile][mode] = validMinutes(input.value, MODES[mode].defaultMinutes, max);
      input.value = profiles[activeProfile][mode];
      saveProfiles();
      if (!isRunning && currentMode === mode) resetTimer();
    });
  });
  document.getElementById('addProfileBtn').addEventListener('click', () => {
    const name = prompt('Yeni Pomodoro profili adı:')?.trim();
    if (!name) return;
    if (profiles[name]) {
      showToast('Bu profil zaten var.');
      return;
    }
    profiles[name] = { work: 25, short: 5, long: 15, pinned: false };
    activeProfile = name;
    saveProfiles();
    localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfile);
    renderProfiles();
    syncInputs();
    setMode(currentMode);
  });
  document.getElementById('deleteProfileBtn').addEventListener('click', deleteActiveProfile);
  document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    if (!history.length || !confirm('Tamamlanmış çalışma geçmişi silinsin mi?')) return;
    history = [];
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    renderHistory();
  });
  const savedAlarmVolume = localStorage.getItem('pomo_alarm_volume');
  if (savedAlarmVolume !== null) document.getElementById('alarmVol').value = savedAlarmVolume;
  elements.alarm.volume = Number(document.getElementById('alarmVol').value);
  document.getElementById('alarmVol').addEventListener('input', (event) => {
    elements.alarm.volume = Number(event.target.value);
    localStorage.setItem('pomo_alarm_volume', event.target.value);
  });
  elements.themeToggle.addEventListener('click', () => applyTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark'));

  renderProfiles();
  syncInputs();
  renderHistory();
  updateModeButtons();
  updateDisplay();
  applyTheme(localStorage.getItem('planner-theme') || 'light');
  setInterval(tick, 250);
})();
</script>
</body>
</html>
